name: release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest build twine
      # python -m pytest puts the repo root on sys.path; tests/test_lifecycle.py imports
      # cleanup_smoke_records from there, which plain `pytest` cannot find.
      - run: python -m pytest -q
      - run: python -m build
      - run: twine check dist/*
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag matches version and is on main
        run: |
          v="${GITHUB_REF_NAME#v}"
          py=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          yml=$(sed -n 's/^version: *//p' plugin.yaml)
          test "$v" = "$py" && test "$v" = "$yml" || { echo "tag $GITHUB_REF_NAME != pyproject $py / plugin.yaml $yml"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tagged commit is not on main"; exit 1; }
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
