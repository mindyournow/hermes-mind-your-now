name: mind-your-now
version: 0.1.1
description: "Mind Your Now — tasks, calendar, habits, timers, debrief, YNAB, and Kaia memory injection for Hermes."
author: "Mind Your Now <team@mindyournow.com>"
kind: standalone
requires_env:
  - MYN_API_KEY
provides_tools:
  - myn_tasks
  - myn_debrief
  - myn_calendar
  - myn_habits
  - myn_lists
  - myn_search
  - myn_timers
  - myn_memory
  - myn_profile
  - myn_household
  - myn_projects
  - myn_planning
  - myn_a2a_pairing
  - myn_ynab
provides_hooks:
  - pre_llm_call
