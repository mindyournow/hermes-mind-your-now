name: mind-your-now
version: 0.1.0
description: "Hermes plugin for Mind Your Now (MYN). Provides 14 tools for tasks, debrief, calendar, habits, lists, search, timers, memory, profile, household, projects, planning, A2A pairing, and YNAB; plus a pre_llm_call hook that injects Kaia memory context. Requires MYN_API_KEY."
author: "Mind Your Now"
kind: standalone
requires_env:
  - MYN_API_KEY
provides_tools:
  - myn_tasks
  - myn_debrief
  - myn_calendar
  - myn_habits
  - myn_lists
  - myn_search
  - myn_timers
  - myn_memory
  - myn_profile
  - myn_household
  - myn_projects
  - myn_planning
  - myn_a2a_pairing
  - myn_ynab
provides_hooks:
  - pre_llm_call
